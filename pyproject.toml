[project]
name = "intern-day-2-backend"
version = "0.1.0"
description = "实习生第二天练习：FastAPI 登录鉴权与待办清单接口"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    # 只装需要的连接器：agent-framework 是元包，会把 Azure/Anthropic/Gemini 等全部拉进来
    "agent-framework-ag-ui>=1.7.0",
    "agent-framework-openai>=1.17.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
